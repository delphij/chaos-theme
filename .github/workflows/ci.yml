name: CI

on:
  push:
  pull_request:
  # Run by hand to publish the demo site again, or from another branch.
  workflow_dispatch:
  schedule:
    # Weekly, so a new Hugo release that breaks the theme shows up before a
    # user reports it.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: Hugo ${{ matrix.hugo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'min' is read from hugo.toml, so the declared minimum is the version
        # that gets tested; check.py keeps theme.toml in agreement with it.
        hugo: [min, latest]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Hugo version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ '${{ matrix.hugo }}' = min ]; then
            v=$(sed -n "s/^ *min *= *'\(.*\)'/\1/p" hugo.toml)
          else
            v=$(gh release view -R gohugoio/hugo --json tagName -q .tagName)
            v=${v#v}
          fi
          test -n "$v"
          echo "hugo=$v" >> "$GITHUB_OUTPUT"

      - name: Install Hugo ${{ steps.version.outputs.hugo }}
        run: |
          v=${{ steps.version.outputs.hugo }}
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v$v/hugo_${v}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build example site
        # --panicOnWarning turns every warning, missing translations included,
        # into a failure.
        run: |
          hugo version
          hugo --source exampleSite --destination "$RUNNER_TEMP/public" \
            --gc --minify --panicOnWarning --printI18nWarnings --printPathWarnings

      - name: Self-checks
        run: python3 tools/check.py --public "$RUNNER_TEMP/public"

      # The demo site on GitHub Pages: built as a real site is, with the
      # search index and the post-build steps, and under the repository's
      # subpath, which checks that every URL the theme emits respects it.
      # Published from every push to main, and from a manual run.
      - name: Build demo site
        if: matrix.hugo == 'latest' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xsltproc
          python3 tools/build_search_index.py --content exampleSite/content \
            --output exampleSite/assets/search-index.json \
            --base-url "/${{ github.event.repository.name }}/"
          hugo --source exampleSite --destination "$RUNNER_TEMP/pages" \
            --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --gc --minify --panicOnWarning
          sh tools/post_build.sh "$RUNNER_TEMP/pages"
          python3 tools/check.py --public "$RUNNER_TEMP/pages"

      - name: Upload demo site
        if: matrix.hugo == 'latest' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  pages:
    # Publishes what the build job uploaded. A manual run from a branch
    # other than main needs that branch allowed in the github-pages
    # environment. One deployment at a time, and none cut short: a newer
    # push waits for the one before it.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    # A v* tag publishes a release, once the theme has built on both versions.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        # The tag must have its own section: a release without notes is a
        # tag pushed by mistake, or a changelog not written yet.
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v h="## [$version]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Build tarball
        # The chaos/ prefix extracts straight into themes/chaos, the directory
        # README.md tells a manual install to use. .gitattributes decides what
        # is left out.
        run: |
          name=chaos-theme-$GITHUB_REF_NAME
          git archive --format=tar --prefix=chaos/ "$GITHUB_REF_NAME" \
            | xz -9 > "$RUNNER_TEMP/$name.tar.xz"
          tar -tJf "$RUNNER_TEMP/$name.tar.xz" chaos/theme.toml chaos/hugo.toml > /dev/null
          echo "TARBALL=$RUNNER_TEMP/$name.tar.xz" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
