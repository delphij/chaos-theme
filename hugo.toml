# Theme defaults. Hugo merges only some sections of a theme's configuration
# into the site -- [params], [menus], [markup], [module], output formats and
# media types among them -- and ignores the site-level keys (baseURL, title,
# locale, hasCJKLanguage, outputs). Those belong in the site's own config;
# exampleSite/hugo.toml is a complete one to start from.

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# The default main menu, used when a site defines none of its own.
[menus]
  [[menus.main]]
    identifier = 'home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    identifier = 'tags'
    pageRef = '/tags'
    weight = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$']]
    inline = [['\(', '\)']]

[markup.goldmark.parser.attribute]
  block = true

[params]
  # Remark42 comment system configuration (optional)
  # Uncomment and configure these to enable the comment system
  # remarkURL = "https://remark.example.com"
  # remarkSiteId = "remark"
  # remarkLocale = "zh"
  # remarkNoFooter = "true"

  # Timestamp display control (optional)
  # Controls whether post timestamps display hours and minutes (HH:MM).
  # Site-wide. By default (omitted or "auto"), shows HH:MM only if the dated
  # pages do not all share one time of day.
  # Set true to always display HH:MM, or false to show only YYYY-MM-DD.
  # showTime = true

  # Article pager navigation (optional)
  # pagerScope:
  #   "section"      (default) step through the article's own Hugo section
  #   "mainSections" step through the site's main-section pages (those the
  #                  homepage, archives and feeds list); pages outside them
  #                  fall back to their section's chronological neighbours
  #   "site"         step through every listed regular page across the site
  #                  (including root-level pages unless marked
  #                  build = { list = 'never' }; branch-bundle section index
  #                  pages are not part of the chain)
  # pagerScope = "section"
  #
  # pagerOrder:
  #   "date"         (default) newest first (Hugo's default page order)
  #   "section"      grouped by Hugo section path (directories with _index.md),
  #                  alphabetical by title within each section
  #   "category"     grouped by primary category (first entry in categories,
  #                  locale-aware title order; uncategorized pages at the end),
  #                  alphabetical by title within each group
  #   "title"        alphabetical by title across the whole scope
  # pagerOrder = "date"

  # Code block soft wrapping (optional, disabled by default)
  # Set true to soft-wrap fenced code blocks by default across the site;
  # individual pages can override via `codeWrap = true/false` in front matter,
  # and individual fences can override via `{.wrap}` or `{.nowrap}`.
  # codeWrap = false

  # Checked task list item styling (optional; default: "none")
  # "none"          keep item text unchanged when checked (checkbox only)
  # "muted"         soften checked item text to --muted
  # "strikethrough" soften to --muted and strike through checked item text
  # Overridable per page in front matter (`taskListChecked`) or per list via
  # `{.task-plain}`, `{.task-muted}`, or `{.task-strike}`.
  # taskListChecked = "none"

  # Wiki / reference-site presentation options (optional, all disabled by default)
  # hidePostDate = false       # omit creation date from post metadata and compact index rows
  #                            # (build_search_index.py also switches search dates to lastmod)
  # hideReadingStats = false   # omit word count and reading time from posts and summaries
  # alwaysShowLastmod = false  # always show last-modified time in post footer (falling back to date)
  # listStyle = "summary"      # "summary" (default) or "index" (compact unpaginated directory lists
  #                            # on home, section, term and archives pages, following pagerOrder;
  #                            # overridable per page or via Hugo [[cascade]])

  # Number of preview posts listed under each category on /categories/ and
  # index-style homepages (default: 10; 0 shows all posts)
  # categoryPreviewCount = 10

  # Client-side full-text search (optional, disabled by default)
  # When enabled, adds a search button to the header and hotkey '/' modal.
  # Generate search index with: python3 themes/chaos/tools/build_search_index.py --output assets/search-index.json
  # [params.search]
  #   enable = true
  #   indexURL = "/search-index.json"
  #   bodyIndexURL = "/search-index-body.json"  # Optional; auto-detected if search-index-body.json exists in assets/

[module]
  [module.hugoVersion]
    extended = false
    # 0.158.0 is where `locale` replaced `languageCode`, which the templates read.
    min = '0.158.0'
