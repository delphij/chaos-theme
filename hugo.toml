baseURL = 'https://example.org/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'My New Hugo Site'

[menus]
  [[menus.main]]
    identifier = 'home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    identifier = 'tags'
    pageRef = '/tags'
    weight = 20

# Hugo does not inherit [outputs] from a theme, so a site has to name the
# formats itself. Without this the feeds render, but /feed.xsl, /sitemap.xsl
# and /atom.xml -- which the theme provides templates for -- are never built.
[outputs]
  home = ['HTML', 'ATOM', 'sitemapxsl', 'RSS', 'feedxsl', 'REDIR']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[markup.highlight]
  noClasses = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$']]
    inline = [['\(', '\)']]

[params]
  # Remark42 comment system configuration (optional)
  # Uncomment and configure these to enable the comment system
  # remarkURL = "https://remark.example.com"
  # remarkSiteId = "remark"
  # remarkLocale = "zh"
  # remarkNoFooter = "true"

  # Client-side full-text search (optional, disabled by default)
  # When enabled, adds a search button to the header and hotkey '/' modal.
  # Generate search index with: python3 themes/chaos/tools/build_search_index.py --output assets/search-index.json
  # [params.search]
  #   enable = true
  #   indexURL = "/search-index.json"
  #   bodyIndexURL = "/search-index-body.json"  # Optional; auto-detected if search-index-body.json exists in assets/

[module]
  [module.hugoVersion]
    extended = false
    # 0.158.0 is where `locale` replaced `languageCode`, which this config uses.
    min = '0.158.0'
