# Theme defaults. Hugo merges only some sections of a theme's configuration
# into the site -- [params], [menus], [markup], [module], output formats and
# media types among them -- and ignores the site-level keys (baseURL, title,
# locale, hasCJKLanguage, outputs). Those belong in the site's own config;
# exampleSite/hugo.toml is a complete one to start from.

# The default main menu, used when a site defines none of its own.
[menus]
  [[menus.main]]
    identifier = 'home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    identifier = 'tags'
    pageRef = '/tags'
    weight = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$']]
    inline = [['\(', '\)']]

[params]
  # Remark42 comment system configuration (optional)
  # Uncomment and configure these to enable the comment system
  # remarkURL = "https://remark.example.com"
  # remarkSiteId = "remark"
  # remarkLocale = "zh"
  # remarkNoFooter = "true"

  # Client-side full-text search (optional, disabled by default)
  # When enabled, adds a search button to the header and hotkey '/' modal.
  # Generate search index with: python3 themes/chaos/tools/build_search_index.py --output assets/search-index.json
  # [params.search]
  #   enable = true
  #   indexURL = "/search-index.json"
  #   bodyIndexURL = "/search-index-body.json"  # Optional; auto-detected if search-index-body.json exists in assets/

[module]
  [module.hugoVersion]
    extended = false
    # 0.158.0 is where `locale` replaced `languageCode`, which the templates read.
    min = '0.158.0'
