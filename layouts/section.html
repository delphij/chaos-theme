{{ define "main" }}
  {{ partial "page-header.html" . }}
  {{ $paginator := .Paginator }}
  {{ range $paginator.Pages }}
    {{- if not (in (site.Params.excludedTypes | default (slice "page")) .Type) -}}
      {{ partial "post-summary.html" . }}
    {{- end -}}
  {{ end }}
  {{ partial "paginator.html" . }}
{{ end }}
