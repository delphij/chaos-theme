{{- /*
Renders a <time> element: machine-readable in the attribute, minutes in the
text.

@context {time} time The time to render, e.g. a page's .Date or .Lastmod.

@example: {{ partial "datetime.html" .Date }}
*/ -}}
<time datetime="{{ time.Format "2006-01-02T15:04:05-07:00" . }}">{{ time.Format "2006-01-02 15:04" . }}</time>
