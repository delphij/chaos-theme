# Media type definitions
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[mediaTypes."application/xslt+xml"]
  suffixes = ["xsl"]

# Output format definitions
[outputFormats.ATOM]
  mediaType = "application/atom+xml"
  baseName = "atom"
  name = "ATOM"

[outputFormats.atomxsl]
  mediaType = "application/xslt+xml"
  baseName = "atom"
  isPlainText = true
  notAlternative = true

[outputFormats.sitemapxsl]
  mediaType = "application/xslt+xml"
  baseName = "sitemap"
  isPlainText = true
  notAlternative = true

[outputFormats.REDIR]
  mediaType = "text/plain"
  baseName = "redirects"
  isPlainText = true
  notAlternative = true

# Output configuration for different page kinds
[outputs]
  home = ["HTML", "ATOM", "atomxsl", "sitemapxsl", "RSS", "REDIR"]
